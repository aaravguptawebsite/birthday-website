<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aarav Gupta, Twenty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080A; --bg2:#0F0F12; --panel:#141418; --line:rgba(201,162,74,.35);
  --gold:#C9A24A; --gold-2:#E6CB86; --gold-3:#8A6A24; --white:#F4F1EA; --muted:#A39D90; --red:#9C1C2E;
  --serif:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Century Gothic",system-ui,-apple-system,sans-serif;
  --board:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#08080A; --white:#F4F1EA; } }
:root[data-theme="dark"]{ --bg:#08080A; --white:#F4F1EA; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--sans);font-weight:300;font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
img,video,svg{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.05}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.narrow{max-width:760px;margin:0 auto;padding:0 24px}
section{padding:clamp(80px,12vw,140px) 0;position:relative}
.kicker{font-size:12px;letter-spacing:.38em;color:var(--gold-2);font-weight:400;text-transform:uppercase}
.sec-title{font-size:clamp(44px,7vw,84px);margin-top:12px}
.gline{display:block;height:1px;width:0;background:linear-gradient(90deg,var(--gold),transparent);margin:22px 0 0;transition:width 1.6s cubic-bezier(.3,0,.2,1)}
.center .gline{margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.in .gline,.gline.in{width:min(220px,60%)}
.center{text-align:center}
.lede{color:var(--muted);max-width:56ch;font-size:18px}
.center .lede{margin-left:auto;margin-right:auto}
.reveal{opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s ease}
.reveal.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--gold);background:transparent;color:var(--white);padding:13px 28px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;transition:background .3s,color .3s}
.btn:hover{background:var(--gold);color:#0a0a0a}
.btn.solid{background:var(--gold);color:#0a0a0a}
.btn.solid:hover{background:var(--gold-2)}
.btn:disabled{opacity:.4;pointer-events:none}
.mini{background:rgba(8,8,10,.85);border:1px solid var(--gold);color:var(--white);font-size:12px;padding:6px 12px;letter-spacing:.06em}
.tool{display:none!important}
.editing .tool{display:inline-flex!important}
.editing [data-k]{outline:1px dashed rgba(230,203,134,.5);outline-offset:3px;cursor:text;min-width:1ch}
.editing [data-k]:focus{outline:1px solid var(--gold-2);background:rgba(230,203,134,.06)}

/* opening */
#intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity 1.2s,visibility 1.2s}
#intro.gone{opacity:0;visibility:hidden}
#intro .name{font-family:var(--serif);font-weight:500;font-size:clamp(56px,11vw,140px);letter-spacing:.02em;opacity:0;transform:translateY(10px);transition:opacity 1.6s,transform 1.6s}
#intro .rule{display:block;height:1px;width:0;margin:18px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:width 1.8s cubic-bezier(.3,0,.2,1) .9s}
#intro .twenty{font-family:var(--serif);font-style:italic;font-size:clamp(26px,4vw,40px);color:var(--gold-2);opacity:0;transition:opacity 1.2s 1.8s}
#intro .dates{font-size:12px;letter-spacing:.42em;color:var(--muted);margin-top:10px;opacity:0;transition:opacity 1.2s 2.2s}
#intro .enter{margin-top:46px;opacity:0;transition:opacity 1s 2.8s,background .3s,color .3s}
#intro.on .name{opacity:1;transform:none}
#intro.on .rule{width:min(320px,70vw)}
#intro.on .twenty,#intro.on .dates,#intro.on .enter{opacity:1}
.goldtext{background:linear-gradient(100deg,#8A6A24 0%,#E6CB86 25%,#FFF3D2 35%,#C9A24A 50%,#8A6A24 68%,#E3C77D 85%,#9C7A2E 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s linear infinite}
@keyframes sheen{to{background-position:220% center}}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:28px;padding:calc(env(safe-area-inset-top,0px) + 16px) 5vw 16px;background:linear-gradient(rgba(8,8,10,.9),rgba(8,8,10,0));transition:background .4s,box-shadow .4s}
.topbar.solid{background:rgba(8,8,10,.94);box-shadow:0 1px 0 var(--line)}
.mono{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.04em;text-decoration:none}
.links{display:flex;gap:26px;margin-left:auto}
.links a{color:var(--white);opacity:.75;text-decoration:none;font-size:12px;letter-spacing:.24em;text-transform:uppercase}
.links a:hover{opacity:1;color:var(--gold-2)}
#soundBtn{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:31;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,8,10,.8);color:var(--gold-2);display:grid;place-items:center;padding:0}
#soundBtn svg{width:18px;height:18px}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(36px,6vw,80px);align-items:start;margin-top:56px}
.portrait{position:relative;padding:12px;border:1px solid var(--line)}
.portrait img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 25%;filter:saturate(.9) contrast(1.02)}
.portrait .mini{position:absolute;left:22px;top:22px}
.about-text .pull{font-family:var(--serif);font-style:italic;font-size:clamp(34px,4.6vw,54px);line-height:1.1;color:var(--gold-2);margin:0 0 28px}
.about-text p{margin:0 0 1.1em;font-size:clamp(17px,1.6vw,19px);color:#E2DDD2}
.cards-title{font-family:var(--serif);font-size:clamp(32px,4.4vw,48px);text-align:center;margin:110px 0 10px}
.cards-sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:40px}
.ifgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.ifc{perspective:1000px;border:0;background:none;padding:0;aspect-ratio:3/4;text-align:center;color:var(--white)}
.ifc .in2{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.ifc.turned .in2{transform:rotateY(180deg)}
.ifc .f,.ifc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#16161a,#0b0b0d);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;gap:10px}
.ifc .f::before,.ifc .b::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,162,74,.18);pointer-events:none}
.ifc .f small{font-size:11px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.ifc .f span{font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);line-height:1.1}
.ifc .f i{font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--gold-2);margin-top:6px;opacity:.7}
.ifc .b{transform:rotateY(180deg);background:linear-gradient(160deg,#1d1810,#0b0b0d)}
.ifc .b strong{font-family:var(--serif);font-weight:500;font-size:clamp(21px,2.2vw,27px);line-height:1.15;color:var(--gold-2)}
.ifc .b em{font-style:normal;font-size:clamp(13px,1.2vw,14.5px);line-height:1.5;color:#D8D2C5}
.editing .ifc .in2{transform:none}
.editing .ifc .b{position:relative;transform:none;margin-top:8px}
.editing .ifc{aspect-ratio:auto}
.editing .ifc .f{position:relative}

/* twenty for twenty */
.twenty-list{list-style:none;padding:0;margin:60px auto 0;max-width:760px;counter-reset:t}
.twenty-list li{display:grid;grid-template-columns:64px 1fr;gap:20px;align-items:baseline;padding:22px 0;border-bottom:1px solid rgba(201,162,74,.14)}
.twenty-list li b{font-family:var(--serif);font-weight:500;font-size:30px;color:var(--gold);text-align:right;line-height:1}
.twenty-list li span{font-family:var(--serif);font-size:clamp(22px,2.4vw,28px);line-height:1.3}
.twenty-list li.hl span{color:var(--gold-2);font-style:italic}

/* his world */
.feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(36px,6vw,80px);align-items:center;margin-top:90px}
.feature.flip>div:first-child{order:2}
.feature h3{font-size:clamp(38px,5vw,58px)}
.feature .copy p{color:#DCD6CA;font-size:17.5px;margin:18px 0 0}
.felt{background:radial-gradient(90% 80% at 50% 40%,#16513E,#0A2A20);border:1px solid var(--line);padding:clamp(26px,4vw,42px);display:grid;justify-items:center;gap:22px;box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.hand{display:flex;gap:clamp(6px,1.4vw,12px)}
.felt{container-type:inline-size}
.pc{--w:min(84px,15cqw);width:var(--w);aspect-ratio:5/7;perspective:800px}
.pc .in2{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.pc.up .in2{transform:rotateY(180deg)}
.pc .bk,.pc .fc{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.pc .bk{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(201,162,74,.35) 6px 7px),repeating-linear-gradient(-45deg,transparent 0 6px,rgba(201,162,74,.35) 6px 7px),#101014;border:3px solid #F4F1EA}
.pc .fc{transform:rotateY(180deg);background:#FBFAF6;color:#111;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:calc(var(--w)*.5)}
.pc .fc small{position:absolute;top:5%;left:9%;font-size:calc(var(--w)*.17);line-height:.95;text-align:center;font-family:var(--sans);font-weight:500}
.handcap{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold-2);min-height:1.3em}
.slip{background:#F7F3E8;color:#141414;padding:26px 24px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.5);font-size:15px}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 6px 0,transparent 6px,#F7F3E8 6.5px) 0 0/12px 10px repeat-x}
.slip::before{top:-10px;transform:rotate(180deg)}.slip::after{bottom:-10px}
.slip h4{margin:0 0 4px;font-family:var(--board);font-weight:900;font-size:22px;letter-spacing:.06em}
.slip .sub{font-size:11px;letter-spacing:.24em;color:#7a7365;margin-bottom:16px}
.slip .rowx{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed #cfc7b4}
.slip .rowx b{font-weight:500}
.form{display:flex;gap:5px}.form i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:#2c6b46}.form i.l{background:#9c1c2e}
.bets{margin-top:34px;display:grid;gap:10px}
.bet{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--line);background:rgba(255,255,255,.02);text-align:left;color:var(--white);font-size:16px;transition:background .3s,border-color .3s}
.bet b{font-family:var(--board);font-weight:800;font-size:20px;color:var(--gold-2);letter-spacing:.04em;white-space:nowrap}
.odds .bet{cursor:default}
.odds .bet b.nm{font-family:var(--sans);font-weight:400;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.barmenu{border:1px solid var(--line);padding:clamp(26px,4vw,40px);background:linear-gradient(160deg,#141418,#0a0a0c)}
.barmenu .drink{padding:16px 0;border-bottom:1px solid rgba(201,162,74,.14)}
.barmenu .drink:last-of-type{border-bottom:0}
.barmenu .dn{font-family:var(--serif);font-size:28px;display:flex;justify-content:space-between;gap:10px}
.barmenu .dd{color:var(--muted);font-size:15.5px}
.barmenu .rule2{font-family:var(--serif);font-style:italic;color:var(--gold-2);font-size:20px;margin-top:16px}
.barphoto{display:grid;justify-items:center;gap:22px}
.pframe{position:relative;border:1px solid var(--line);padding:10px;width:320px;max-width:100%}
.pframe img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 25%}
.pframe .mini{position:absolute;left:20px;top:20px}
.pframe figcaption{font-family:var(--serif);font-style:italic;text-align:center;color:var(--gold-2);font-size:21px;margin-top:10px}
#shots{border:0;background:none;padding:0;display:flex;gap:2px;align-items:flex-end;height:110px}
#shots svg{width:52px;transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
#shots.clink svg:first-child{transform:rotate(16deg) translate(8px,-12px)}
#shots.clink svg:last-child{transform:rotate(-16deg) translate(-8px,-12px)}
.shotcap{font-size:12px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.menucard{border:1px solid var(--line);outline:1px solid rgba(201,162,74,.15);outline-offset:6px;padding:clamp(28px,4vw,46px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.menucard h4{font-family:var(--serif);font-weight:500;font-size:28px;color:var(--gold-2);margin:0 0 14px;text-align:center}
.menucard .dish{text-align:center;padding:6px 0;font-size:16px;position:relative}
.menucard .dish .rm{position:absolute;right:0;top:4px}
.menucard .foot{grid-column:1/-1;text-align:center;font-family:var(--serif);font-style:italic;color:var(--gold-2);font-size:21px;border-top:1px solid rgba(201,162,74,.18);padding-top:18px}

/* anthem */
#anthem .screen{position:relative;max-width:900px;margin:50px auto 0;aspect-ratio:16/9;border:1px solid var(--line);background:radial-gradient(70% 70% at 50% 40%,#1b1712,#050506);display:grid;place-items:center;overflow:hidden}
#anthem .screen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(255,255,255,.015) 3px 4px)}
#anthem .play{width:92px;height:92px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,8,10,.6);display:grid;place-items:center;color:var(--gold-2);transition:transform .3s,background .3s;position:relative}
#anthem .play:hover{transform:scale(1.06);background:rgba(201,162,74,.15)}
#anthem .play svg{width:30px;height:30px;margin-left:5px}
#stadium{position:fixed;inset:0;z-index:62;background:#000;display:none;overflow:hidden}
#stadium.show{display:block}
#stadium video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity 1s}
#stadium.lit video{opacity:1}
#stadium .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 30%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.88))}
.board{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 7%);transform:translateX(-50%);width:min(92vw,860px);min-height:clamp(120px,22vh,210px);display:grid;place-items:center;padding:16px 20px;background:rgba(5,5,6,.82);border:1px solid var(--line);text-align:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.board .line{font-family:var(--board);font-weight:800;color:var(--gold-2);font-size:clamp(32px,7vw,78px);line-height:.95;letter-spacing:.03em;text-transform:uppercase}
.board .line.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.board .line.name{font-weight:900;color:#fff;font-size:clamp(44px,10vw,118px);animation:pop .35s cubic-bezier(.3,1.6,.5,1),pulse .5s .35s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pulse{to{transform:scale(1.05)}}
#closeAnthem{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:3;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);padding:8px 18px;font-size:12px;letter-spacing:.2em}

/* moments */
.gallery{columns:3 260px;column-gap:16px;margin-top:56px}
.gitem{break-inside:avoid;margin:0 0 16px;position:relative;border:1px solid rgba(201,162,74,.2);background:#0d0d10;cursor:zoom-in}
.gitem img{display:block;width:100%;height:auto}
.gitem .mtools{position:absolute;left:8px;top:8px;display:none;gap:6px}
.editing .gitem .mtools{display:flex}
.gitem figcaption{font-size:14px;color:var(--muted);padding:8px 12px;min-height:0}
.gitem figcaption:empty{display:none}
.editing .gitem figcaption:empty{display:block;min-height:2em}
.addtile{width:100%;padding:40px 0;border:1px dashed var(--gold);background:none;color:var(--gold-2);margin-top:6px}

/* letters */
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px;margin-top:56px}
.env{border:1px solid var(--line);background:linear-gradient(160deg,#141418,#0a0a0c);text-align:left;color:var(--white);padding:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.env .cover{position:relative;aspect-ratio:4/3;background:#111;overflow:hidden}
.env .cover img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:saturate(.85)}
.env .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(8,8,10,.85))}
.env .seal{position:relative;margin:-28px auto 12px;z-index:2;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c94a5a,var(--red) 55%,#5e0f1b);display:grid;place-items:center;font-family:var(--serif);font-size:20px;color:#f1c8ce;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.env .body{padding:0 22px 24px;text-align:center;position:relative;z-index:2}
.env .from{font-size:12px;letter-spacing:.3em;color:var(--gold-2);text-transform:uppercase}
.env .riddle{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.25;margin-top:10px}
.env .mtools{position:absolute;left:10px;top:10px;z-index:3;display:none;gap:6px;flex-wrap:wrap}
.editing .env .mtools{display:flex}
.env.opened .seal{background:radial-gradient(circle at 35% 30%,#7a6a4a,#3a3020)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:none;place-items:normal;padding:20px;overflow-y:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show{display:grid}
.modal>*{margin:auto}
.lockbox{width:min(520px,100%);background:linear-gradient(160deg,#16161a,#08080a);border:1px solid var(--line);text-align:center;position:relative;overflow:hidden}
.lockbox .cover{aspect-ratio:16/10;background:#111}
.lockbox .cover img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.lockbox .inner{padding:30px 26px 30px}
.lockbox .from{font-size:12px;letter-spacing:.3em;color:var(--gold-2);text-transform:uppercase}
.lockbox h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(26px,4vw,34px);margin:10px 0 20px;line-height:1.2}
.pwrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pwrow input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:13px 16px;border:1px solid rgba(255,255,255,.25);background:#060607;color:var(--white)}
.pwerr{color:#e8a1aa;min-height:1.5em;margin-top:12px;font-size:15px}
.lockbox.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.paper{position:relative;width:min(680px,100%);background:#FBF8F0;color:#1a1714;padding:clamp(34px,7vw,64px);box-shadow:0 30px 80px rgba(0,0,0,.6);font-size:18px;line-height:1.8;text-align:left;animation:slideup .9s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(60px);opacity:0}}
.paper .pfrom{font-size:12px;letter-spacing:.3em;color:#8A6A24;text-transform:uppercase;margin-bottom:18px}
.paper p{margin:0 0 1em}
.close{position:absolute;top:10px;right:14px;background:none;border:0;font-size:28px;line-height:1;color:var(--muted);z-index:3}
.paper .close{color:#777}
.soon{padding:10px 0 4px;color:var(--muted)}

/* letter box */
.lbox-wrap{display:grid;justify-items:center;gap:22px;margin-top:60px;transition:opacity .8s}
.lbox-wrap.gone{opacity:0;pointer-events:none}
#letterBox{position:relative;width:min(440px,86vw);aspect-ratio:4/3;border:0;background:none;padding:0;perspective:1200px}
.lb-glow{position:absolute;left:10%;right:10%;top:20%;height:40%;background:radial-gradient(50% 60% at 50% 100%,rgba(255,236,190,.55),transparent 70%);opacity:0;transition:opacity 1s .4s;filter:blur(6px)}
.lb-base{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(160deg,#1b1b20,#060607 70%);border:1px solid var(--line);box-shadow:0 40px 80px rgba(0,0,0,.65)}
.lb-base::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:16px;margin-left:-8px;background:linear-gradient(90deg,#8A6A24,#E6CB86,#8A6A24)}
.lb-lid{position:absolute;left:-3%;right:-3%;top:12%;height:24%;background:linear-gradient(160deg,#26262c,#0b0b0d);border:1px solid var(--gold);transform-origin:50% 0;transition:transform 1.3s cubic-bezier(.5,0,.2,1),opacity 1.3s;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.lb-lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:16px;margin-left:-8px;background:linear-gradient(90deg,#8A6A24,#E6CB86,#8A6A24)}
.lb-lid span{position:relative;font-family:var(--serif);font-style:italic;font-size:clamp(22px,3.4vw,30px);color:var(--gold-2);background:#111114;padding:2px 18px;border:1px solid var(--line)}
#letterBox:hover .lb-lid{transform:translateY(-4px)}
#letterBox.open .lb-lid{transform:translateY(-70%) rotateX(75deg);opacity:0}
#letterBox.open .lb-glow{opacity:1}
.lbox-sub{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.envs[hidden]{display:none!important}
.editing .envs[hidden]{display:grid!important}
.editing .lbox-wrap{display:none}
/* family */
#family .screen{position:relative;max-width:900px;margin:50px auto 0;aspect-ratio:16/9;border:1px solid var(--line);overflow:hidden;background:#0b0b0d;display:grid;place-items:center}
#family .screen img.cov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
#family .screen video{position:absolute;inset:0;width:100%;height:100%;background:#000}
#family .play{position:relative;width:92px;height:92px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,8,10,.6);display:grid;place-items:center;color:var(--gold-2)}
#family .play svg{width:30px;height:30px;margin-left:5px}
#family .soonmsg{position:relative;text-align:center;font-family:var(--serif);font-style:italic;font-size:clamp(24px,3vw,32px);color:var(--gold-2)}
#family .tools{position:absolute;left:12px;top:12px;z-index:3;gap:6px}

/* closing */
#closing{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:80px 0}
#closing svg{width:min(420px,70vw);height:auto;overflow:visible}
#closing text.m{font-family:var(--serif);font-weight:500;font-size:150px;fill:transparent;stroke:var(--gold-2);stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900}
#closing.go text.m{animation:drawm 4.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawm{70%{stroke-dashoffset:0;fill:transparent}100%{stroke-dashoffset:0;fill:rgba(230,203,134,.92)}}
#closing .hb{font-size:clamp(13px,1.6vw,15px);letter-spacing:.5em;color:var(--white);margin-top:26px;opacity:0;transition:opacity 1.6s 4.2s;text-transform:uppercase}
#closing .dt{font-size:12px;letter-spacing:.42em;color:var(--muted);margin-top:12px;opacity:0;transition:opacity 1.6s 4.8s}
#closing.go .hb,#closing.go .dt{opacity:1}
#closing .fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s 9s}
#closing.go .fade{opacity:.85}

/* vault */
#vault{padding-bottom:clamp(60px,9vw,110px)}
.vault{display:grid;justify-items:center;gap:22px;margin-top:44px;transition:opacity .8s,max-height 1s}
.vault.gone{opacity:0;pointer-events:none}
.vdoor-wrap{position:relative;width:min(230px,58vw);aspect-ratio:1;perspective:1000px}
.vlight{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff4d4 0%,#e6cb86 35%,rgba(201,162,74,.15) 70%,transparent 75%);opacity:0;transition:opacity 1s .6s}
.vdoor{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2b2b31,#0c0c0f 70%);border:2px solid var(--gold);box-shadow:0 0 0 8px #141418,0 0 0 9px var(--line),0 30px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.7);transform-origin:0% 50%;transition:transform 1.4s cubic-bezier(.6,0,.2,1) .9s;display:grid;place-items:center}
.vdoor::before{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(201,162,74,.35)}
.vbolts{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 3%,var(--gold-2) 0 4px,transparent 5px),radial-gradient(circle at 50% 97%,var(--gold-2) 0 4px,transparent 5px),radial-gradient(circle at 3% 50%,var(--gold-2) 0 4px,transparent 5px),radial-gradient(circle at 97% 50%,var(--gold-2) 0 4px,transparent 5px);opacity:.8}
.vdial{position:relative;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#E6CB86 0 18%,#8A6A24 19% 22%,#1a1a1f 23%);border:2px solid var(--gold);transition:transform 1s cubic-bezier(.4,0,.2,1)}
.vdial span,.vdial::before,.vdial::after{content:"";position:absolute;left:50%;top:-14%;width:3px;height:128%;margin-left:-1.5px;background:linear-gradient(var(--gold-2),var(--gold-3));border-radius:2px}
.vdial::before{transform:rotate(60deg)}.vdial::after{transform:rotate(-60deg)}
.vault.open .vdial{transform:rotate(300deg)}
.vault.open .vdoor{transform:rotateY(-105deg)}
.vault.open .vlight{opacity:1}
.vault .pwrow{width:min(420px,90vw)}
.vault.shake .vdoor-wrap{animation:shake .4s}
.vcontent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,48px);margin-top:50px;text-align:center}
.vcontent[hidden]{display:none}
.vitem{opacity:0;transform:translateY(30px);transition:opacity 1.2s,transform 1.2s}
.vcontent.on .vitem{opacity:1;transform:none}
.vcontent.on .vitem:nth-child(2){transition-delay:.5s}
.vlabel{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:22px}
.vitem h3{font-size:clamp(30px,3.6vw,40px);margin:4px 0 6px}
.vitem p{color:var(--muted);margin:0 0 18px;font-size:15px;letter-spacing:.04em}
.vcover{position:relative;display:block;width:100%;aspect-ratio:4/5;border:1px solid var(--line);padding:10px;background:#0c0c0f;overflow:hidden}
.vcover img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform 1.2s}
.vcover:hover img{transform:scale(1.04)}
.vcover .vtap{position:absolute;left:10px;right:10px;bottom:10px;padding:46px 0 18px;background:linear-gradient(transparent,rgba(8,8,10,.92));font-size:12px;letter-spacing:.3em;color:var(--gold-2);text-transform:uppercase}
.vfam{position:relative;width:100%;aspect-ratio:4/5;border:1px solid var(--line);padding:10px;background:#0c0c0f;display:grid;place-items:center;overflow:hidden}
.vfam img.cov{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:cover;filter:brightness(.5)}
.vfam video{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);background:#000;object-fit:contain}
.vfam .play{position:relative;width:84px;height:84px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,8,10,.6);display:grid;place-items:center;color:var(--gold-2)}
.vfam .play svg{width:28px;height:28px;margin-left:5px}
.vfam .soonmsg{position:relative;font-family:var(--serif);font-style:italic;font-size:26px;color:var(--gold-2)}
.letterpaper{position:relative;width:min(720px,100%);background:#FBF8F1;color:#1d1a16;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:left;animation:slideup .9s cubic-bezier(.2,.8,.2,1)}
.letterpaper .lpimg{display:block;width:100%;max-height:62vh;object-fit:cover;object-position:50% 35%}
.letterpaper .lpbody{padding:clamp(30px,6vw,60px)}
.letterpaper p{font-family:var(--serif);font-weight:500;font-size:clamp(19px,2vw,21px);line-height:1.75;margin:0 0 1.05em}
.letterpaper .close{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
/* cinematic moments */
.gitem{opacity:0;transform:scale(1.06);filter:blur(10px) brightness(.35);transition:opacity 1.4s ease,transform 1.8s ease,filter 1.4s ease}
.gitem.shown{opacity:1;transform:none;filter:none}
.editing .gitem{opacity:1;transform:none;filter:none}
/* two vaults */
.vaults{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(30px,5vw,60px);margin-top:50px;align-items:start}
.vcol{display:grid;justify-items:center;text-align:center}
.vcol h3{font-size:clamp(28px,3.4vw,38px);margin:4px 0 6px}
.vcol>p{color:var(--muted);margin:0;font-size:15px;letter-spacing:.04em}
.vaults .vault{margin-top:26px;width:100%}
.vaults .vdoor-wrap{width:min(190px,46vw)}
.vaults .vault .pwrow{width:100%;max-width:360px}
.vopen{width:100%;margin-top:26px;opacity:0;transform:translateY(24px);transition:opacity 1.1s,transform 1.1s}
.vopen.on{opacity:1;transform:none}
@media (max-width:860px){.vaults{grid-template-columns:1fr}}
/* ribbon gifts */
.gift{position:relative;display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--line);overflow:hidden;padding:0;transition:transform .4s,box-shadow .4s}
.gift:hover,.gift:focus-visible{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.5)}
.gift-letter{background:linear-gradient(160deg,#F6F0E2,#E9DFC8)}
.gift-letter::before{content:"";position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(160deg,#EFE6D2,#E2D6BB);clip-path:polygon(0 0,100% 0,50% 100%);box-shadow:0 4px 8px rgba(0,0,0,.08)}
.gift-fam{background:linear-gradient(160deg,#1d1d22,#060607)}
.gift-fam::before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,162,74,.25)}
.rib-v,.rib-h{position:absolute;background:linear-gradient(90deg,#8A6A24,#E6CB86 50%,#8A6A24);box-shadow:0 0 8px rgba(0,0,0,.25)}
.rib-v{top:0;bottom:0;left:50%;width:20px;margin-left:-10px}
.rib-h{left:0;right:0;top:50%;height:20px;margin-top:-10px;background:linear-gradient(180deg,#8A6A24,#E6CB86 50%,#8A6A24)}
.gift .bow{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-62%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.gtap{position:absolute;left:0;right:0;bottom:14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.gift-letter .gtap{color:#6b5320}.gift-fam .gtap{color:var(--gold-2)}
/* side-by-side viewers */
.sidebyside{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);width:min(1200px,100%);height:min(88vh,860px);background:#FBF8F1;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:slideup .9s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sbs-photo{background:#0b0b0d;display:grid;place-items:center;overflow:hidden}
.sbs-photo img{width:100%;height:100%;object-fit:contain}
.sbs-text{overflow-y:auto;padding:clamp(30px,5vw,56px);color:#1d1a16;text-align:left}
.sbs-text p{font-family:var(--serif);font-weight:500;font-size:clamp(19px,1.7vw,21px);line-height:1.75;margin:0 0 1.05em}
.sidebyside.dark{background:#0b0b0d}
.sbs-video{display:grid;place-items:center;background:#000}
.sbs-video video{width:100%;height:100%;object-fit:contain;background:#000}
.sbs-video .soonmsg{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--gold-2);text-align:center;padding:20px}
.sidebyside .close{z-index:5;color:#fff;background:rgba(0,0,0,.45);width:40px;height:40px;border-radius:50%;top:12px;right:12px;font-size:24px}
@media (max-width:860px){
  .vcontent{grid-template-columns:1fr}
  .sidebyside{grid-template-columns:1fr;height:auto;max-height:none}
  .sbs-photo img{height:auto;max-height:none}
  .sbs-text{overflow:visible}
  .sbs-video{min-height:56vw}
  .sidebyside .close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
}
/* lightbox + edit bar */
.lb{position:relative;margin:0;max-width:min(1100px,100%);text-align:center}
.lb img{display:block;max-width:100%;max-height:82vh;margin:0 auto;border:1px solid var(--line)}
.lb figcaption{margin-top:14px;color:var(--white)}
.lb .close{top:-44px;right:0;color:var(--white)}
#editFab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:75;background:#08080a;border:1px solid var(--gold);color:var(--gold-2);padding:10px 18px;font-size:13px;letter-spacing:.12em}
#editBar{position:fixed;left:0;right:0;bottom:0;z-index:76;background:rgba(8,8,10,.96);border-top:1px solid var(--gold);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.editing #editBar{display:flex}
.editing #editFab,.editing #soundBtn{display:none}
.editing{padding-bottom:90px}
#editBar .note{font-size:14px;color:var(--muted)}
#editBar .acts{display:flex;gap:10px}
#editBar .btn{padding:10px 18px}
.led{width:min(620px,100%);background:#0f0f12;border:1px solid var(--line);padding:30px 26px;position:relative;text-align:left}
.led h3{font-size:30px;margin-bottom:16px}
.led label{display:block;font-size:12px;letter-spacing:.2em;color:var(--gold-2);margin:14px 0 6px;text-transform:uppercase}
.led input,.led textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;background:#060607;color:var(--white);border:1px solid rgba(255,255,255,.22)}
.led textarea{min-height:240px;line-height:1.6}
.led .hint{font-size:13px;color:var(--muted);margin-top:6px}
.led .acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

@media (max-width:860px){
  .links{display:none}
  .about-grid,.feature{grid-template-columns:1fr}
  .feature.flip>div:first-child{order:0}
  .ifgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .menucard{grid-template-columns:1fr}
  .twenty-list li{grid-template-columns:44px 1fr;gap:14px}
  .twenty-list li b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>

<script type="application/json" id="content">{"media":{"chant":"","video":""},"intro":{"name":"Aarav Gupta","dates":"26.11.2006  —  26.11.2026"},"about":{"kicker":"About","title":"The man himself","portrait":"portrait.jpg","pull":"“The funniest person we’ve ever met.”","p1":"Aarav Gupta arrived on 26 November 2006 and has spent the twenty years since perfecting the art of being himself. Ahmedabad is home, and it’s hard to find a corner of the city where people don’t know his name. Ask anyone who knows him and they’ll tell you the same thing: he is, without question, the funniest person they have ever met. He can hold a conversation with anyone, from his closest friends to every aunty at the party, all of whom adore him. He is the friend who keeps the night going long after it should have ended: at the head of the poker table, three screens deep into a match half the room has never heard of, or on a call that was meant to last five minutes. He loves his whiskey, and his palate is loyal: Italian, Indian, and Mexican when he’s feeling adventurous, and very little else. Calm when the stakes are high, loudest when the chant starts, and impossible not to like, he is, in a word, King.","cardsTitle":"If Aarav were…","cardsSub":"Tap a card to turn it over.","cards":[{"q":"A drink","a":"Chivas Regal 18, neat","r":"Smooth, aged well, and never in a hurry."},{"q":"A playing card","a":"The King of Spades","r":"Obviously."},{"q":"A piece of clothing","a":"A Moncler jacket","r":"Effortless, and always there."},{"q":"A dish","a":"Garlic naan, dal makhani and paneer tikka masala","r":"Rich, comforting, and the table everyone wants a seat at."},{"q":"A TV show","a":"The O.C.","r":"Main character energy and a little drama."},{"q":"A city","a":"Ahmedabad","r":"Home turf, and proud of it."},{"q":"A car","a":"Range Rover Autobiography","r":"Quiet luxury and a commanding presence."},{"q":"A song","a":"Mr. Brightside","r":"It starts every night out, and somehow everyone knows every word."},{"q":"A time of day","a":"3am","r":"When he peaks: one more episode, one more hand, one more bet, or a call with friends that should have ended hours ago."},{"q":"A bet","a":"A bet on a match he’s never watched","r":"Placed with total confidence."},{"q":"A sport moment","a":"Lifting the trophy as football champion","r":"Built for the big finish."},{"q":"A word","a":"King","r":"Nothing more to add."}]},"twenty":{"kicker":"Twenty for twenty","title":"Twenty things we love about him","highlight":9,"lines":["The first to make the room laugh, and the last to leave it.","Known across Ahmedabad by name, and by reputation.","The calmest person at the poker table, and the most dangerous.","There’s always a match on, and he always has an opinion on how it’ll end.","A whiskey in hand and a story ready to go.","He knows exactly what he likes and never apologises for it.","He turns ordinary evenings into the ones we talk about for years.","Generous with his jokes, his time and his company.","Twenty years in, and still the person everyone wants at the table.","His catchphrase isn’t even his: “He’s here, he’s there, he’s every f***ing where. Aarav Gupta.”","The most Aarav thing he’s ever done? Being himself: unapologetically funny, and proudly the main character of every story.","Quietly one of the best sportsmen we know. Put a football at his feet and watch.","On the dance floor, the confidence stays. The rhythm doesn’t.","When he’s truly happy, he becomes a kid again: over good food, a big win at the poker table, or a great film.","His best advice: be grateful to have him as a friend, because it’s an honour. He may have a point.","Behind the jokes, his family always comes first. He’d give them everything, without hesitation and without limits.","Every room feels a little quieter the moment he leaves it.","Every story he tells is legendary, mostly because he’s in it.","May his twenties be as loud, as lucky and as legendary as he is.","And the best part? After twenty years, he’s <script>
const TEMPLATE = "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Aarav Gupta, Twenty\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Big+Shoulders+Display:wght@800;900&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#08080A; --bg2:#0F0F12; --panel:#141418; --line:rgba(201,162,74,.35);\n  --gold:#C9A24A; --gold-2:#E6CB86; --gold-3:#8A6A24; --white:#F4F1EA; --muted:#A39D90; --red:#9C1C2E;\n  --serif:\"Cormorant Garamond\",\"Didot\",\"Bodoni 72\",Georgia,serif;\n  --sans:\"Jost\",\"Futura\",\"Century Gothic\",system-ui,-apple-system,sans-serif;\n  --board:\"Big Shoulders Display\",Impact,\"Arial Narrow\",sans-serif;\n  color-scheme:dark; box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){ --bg:#08080A; --white:#F4F1EA; } }\n:root[data-theme=\"dark\"]{ --bg:#08080A; --white:#F4F1EA; }\n*,*::before,*::after{box-sizing:inherit}\n[hidden]{display:none!important}\nhtml{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--white);font-family:var(--sans);font-weight:300;font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}\nbody.locked{overflow:hidden;height:100%}\nimg,video,svg{max-width:100%}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}\nh1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.05}\n.wrap{max-width:1100px;margin:0 auto;padding:0 24px}\n.narrow{max-width:760px;margin:0 auto;padding:0 24px}\nsection{padding:clamp(80px,12vw,140px) 0;position:relative}\n.kicker{font-size:12px;letter-spacing:.38em;color:var(--gold-2);font-weight:400;text-transform:uppercase}\n.sec-title{font-size:clamp(44px,7vw,84px);margin-top:12px}\n.gline{display:block;height:1px;width:0;background:linear-gradient(90deg,var(--gold),transparent);margin:22px 0 0;transition:width 1.6s cubic-bezier(.3,0,.2,1)}\n.center .gline{margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}\n.in .gline,.gline.in{width:min(220px,60%)}\n.center{text-align:center}\n.lede{color:var(--muted);max-width:56ch;font-size:18px}\n.center .lede{margin-left:auto;margin-right:auto}\n.reveal{opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s ease}\n.reveal.in{opacity:1;transform:none}\n.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--gold);background:transparent;color:var(--white);padding:13px 28px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;transition:background .3s,color .3s}\n.btn:hover{background:var(--gold);color:#0a0a0a}\n.btn.solid{background:var(--gold);color:#0a0a0a}\n.btn.solid:hover{background:var(--gold-2)}\n.btn:disabled{opacity:.4;pointer-events:none}\n.mini{background:rgba(8,8,10,.85);border:1px solid var(--gold);color:var(--white);font-size:12px;padding:6px 12px;letter-spacing:.06em}\n.tool{display:none!important}\n.editing .tool{display:inline-flex!important}\n.editing [data-k]{outline:1px dashed rgba(230,203,134,.5);outline-offset:3px;cursor:text;min-width:1ch}\n.editing [data-k]:focus{outline:1px solid var(--gold-2);background:rgba(230,203,134,.06)}\n\n/* opening */\n#intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity 1.2s,visibility 1.2s}\n#intro.gone{opacity:0;visibility:hidden}\n#intro .name{font-family:var(--serif);font-weight:500;font-size:clamp(56px,11vw,140px);letter-spacing:.02em;opacity:0;transform:translateY(10px);transition:opacity 1.6s,transform 1.6s}\n#intro .rule{display:block;height:1px;width:0;margin:18px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:width 1.8s cubic-bezier(.3,0,.2,1) .9s}\n#intro .twenty{font-family:var(--serif);font-style:italic;font-size:clamp(26px,4vw,40px);color:var(--gold-2);opacity:0;transition:opacity 1.2s 1.8s}\n#intro .dates{font-size:12px;letter-spacing:.42em;color:var(--muted);margin-top:10px;opacity:0;transition:opacity 1.2s 2.2s}\n#intro .enter{margin-top:46px;opacity:0;transition:opacity 1s 2.8s,background .3s,color .3s}\n#intro.on .name{opacity:1;transform:none}\n#intro.on .rule{width:min(320px,70vw)}\n#intro.on .twenty,#intro.on .dates,#intro.on .enter{opacity:1}\n.goldtext{background:linear-gradient(100deg,#8A6A24 0%,#E6CB86 25%,#FFF3D2 35%,#C9A24A 50%,#8A6A24 68%,#E3C77D 85%,#9C7A2E 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s linear infinite}\n@keyframes sheen{to{background-position:220% center}}\n\n/* top bar */\n.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:28px;padding:calc(env(safe-area-inset-top,0px) + 16px) 5vw 16px;background:linear-gradient(rgba(8,8,10,.9),rgba(8,8,10,0));transition:background .4s,box-shadow .4s}\n.topbar.solid{background:rgba(8,8,10,.94);box-shadow:0 1px 0 var(--line)}\n.mono{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.04em;text-decoration:none}\n.links{display:flex;gap:26px;margin-left:auto}\n.links a{color:var(--white);opacity:.75;text-decoration:none;font-size:12px;letter-spacing:.24em;text-transform:uppercase}\n.links a:hover{opacity:1;color:var(--gold-2)}\n#soundBtn{position:fixed;left:18px yle:italic;font-size:clamp(22px,3.4vw,30px);color:var(--gold-2);background:#111114;padding:2px 18px;border:1px solid var(--line)}\n#letterBox:hover .lb-lid{transform:translateY(-4px)}\n#letterBox.open .lb-lid{transform:translateY(-70%) rotateX(75deg);opacity:0}\n#letterBox.open .lb-glow{opacity:1}\n.lbox-sub{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}\n.envs[hidden]{display:none!important}\n.editing .envs[hidden]{display:grid!important}\n.editing .lbox-wrap{display:none}\n/* family */\n#family .screen{position:relative;max-width:900px;margin:50px auto 0;aspect-ratio:16/9;border:1px solid var(--line);overflow:hidden;background:#0b0b0d;display:grid;place-items:center}\n#family .screen img.cov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}\n#family .screen video{position:absolute;inset:0;width:100%;height:100%;background:#000}\n#family .play{position:relative;width:92px;height:92px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,8,10,.6);display:grid;place-items:center;color:var(--gold-2)}\n#family .play svg{width:30px;height:30px;margin-left:5px}\n#family .soonmsg{position:relative;text-align:center;font-family:var(--serif);font-style:italic;font-size:clamp(24px,3vw,32px);color:var(--gold-2)}\n#family .tools{position:absolute;left:12px;top:12px;z-index:3;gap:6px}\n\n/* closing */\n#closing{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:80px 0}\n#closing svg{width:min(420px,70vw);height:auto;overflow:visible}\n#closing text.m{font-family:var(--serif);font-weight:500;font-size:150px;fill:transparent;stroke:var(--gold-2);stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900}\n#closing.go text.m{animation:drawm 4.5s cubic-bezier(.4,0,.2,1) forwards}\n@keyframes drawm{70%{stroke-dashoffset:0;fill:transparent}100%{stroke-dashoffset:0;fill:rgba(230,203,134,.92)}}\n#closing .hb{font-size:clamp(13px,1.6vw,15px);letter-spacing:.5em;color:var(--white);margin-top:26px;opacity:0;transition:opacity 1.6s 4.2s;text-transform:uppercase}\n#closing .dt{font-size:12px;letter-spacing:.42em;color:var(--muted);margin-top:12px;opacity:0;transition:opacity 1.6s 4.8s}\n#closing.go .hb,#closing.go .dt{opacity:1}\n#closing .fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s 9s}\n#closing.go .fade{opacity:.85}\n\n/* vault */\n#vault{padding-bottom:clamp(60px,9vw,110px)}\n.vault{display:grid;justify-items:center;gap:22px;margin-top:44px;transition:opacity .8s,max-height 1s}\n.vault.gone{opacity:0;pointer-events:none}\n.vdoor-wrap{position:relative;width:min(230px,58vw);aspect-ratio:1;perspective:1000px}\n.vlight{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff4d4 0%,#e6cb86 35%,rgba(201,162,74,.15) 70%,transparent 75%);opacity:0;transition:opacity 1s .6s}\n.vdoor{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2b2b31,#0c0c0f 70%);border:2px solid var(--gold);box-shadow:0 0 0 8px #141418,0 0 0 9px var(--line),0 30px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.7);transform-origin:0% 50%;transition:transform 1.4s cubic-bezier(.6,0,.2,1) .9s;display:grid;place-items:center}\n.vdoor::before{content:\"\";position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(201,162,74,.35)}\n.vbolts{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 3%,var(--gold-2) 0 4px,transparent 5px),radial-gradient(circle at 50% 97%,var(--gold-2) 0 4px,transparent 5px),radial-gradient(circle at 3% 50%,var(--gold-2) 0 4px,transparent 5px),radial-gradient(circle at 97% 50%,var(--gold-2) 0 4px,transparent 5px);opacity:.8}\n.vdial{position:relative;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#E6CB86 0 18%,#8A6A24 19% 22%,#1a1a1f 23%);border:2px solid var(--gold);transition:transform 1s cubic-bezier(.4,0,.2,1)}\n.vdial span,.vdial::before,.vdial::after{content:\"\";position:absolute;left:50%;top:-14%;width:3px;height:128%;margin-left:-1.5px;background:linear-gradient(var(--gold-2),var(--gold-3));border-radius:2px}\n.vdial::before{transform:rotate(60deg)}.vdial::after{transform:rotate(-60deg)}\n.vault.open .vdial{transform:rotate(300deg)}\n.vault.open .vdoor{transform:rotateY(-105deg)}\n.vault.open .vlight{opacity:1}\n.vault .pwrow{width:min(420px,90vw)}\n.vault.shake .vdoor-wrap{animation:shake .4s}\n.vcontent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,48px);margin-top:50px;text-align:center}\n.vcontent[hidden]{display:none}\n.vitem{opacity:0;transform:translateY(30px);transition:opacity 1.2s,transform 1.2s}\n.vcontent.on .vitem{opacity:1;transform:none}\n.vcontent.on .vitem:nth-child(2){transition-delay:.5s}\n.vlabel{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:22px}\n.vitem h3{font-size:clamp(30px,3.6vw,40px);margin:4px 0 6px}\n.vitem p{color:var(--muted);margin:0 0 18px;font-size:15px;letter-spacing:.04em}\n.vcover{position:relative;display:block;width:100%;aspect-ratio:4/5;border:1px solid var(--line);padding:10px;background:#0c0c0f;overflow:hidden}\n.vcover img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform 1.2s}\n.vcover:hover img{transform:scale(1.04)}\n.vcover .vtap{position:absolute;left:10px;right:10px;bottom:10px;padding:46px 0 18px;background:linear-gradient(transparent,rgba(8,8,10,.92));font-size:12px;letter-spacing:.3em;color:var(--gold-2);text-transform:uppercase}\n.vfam{position:relative;width:100%;aspect-ratio:4/5;border:1px solid var(--line);padding:10px;background:#0c0c0f;display:grid;place-items:center;overflow:hidden}\n.vfam img.cov{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:cover;filter:brightness(.5)}\n.vfam video{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);background:#000;object-fit:contain}\n.vfam .play{position:relative;width:84px;height:84px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,8,10,.6);display:grid;place-items:center;color:var(--gold-2)}\n.vfam .play svg{width:28px;height:28px;margin-left:5px}\n.vfam .soonmsg{position:relative;font-family:var(--serif);font-style:italic;font-size:26px;color:var(--gold-2)}\n.letterpaper{position:relative;width:min(720px,100%);background:#FBF8F1;color:#1d1a16;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:left;animation:slideup .9s cubic-bezier(.2,.8,.2,1)}\n.letterpaper .lpimg{display:block;width:100%;max-height:62vh;object-fit:cover;object-position:50% 35%}\n.letterpaper .lpbody{padding:clamp(30px,6vw,60px)}\n.letterpaper p{font-family:var(--serif);font-weight:500;font-size:clamp(19px,2vw,21px);line-height:1.75;margin:0 0 1.05em}\n.letterpaper .close{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}\n/* cinematic moments */\n.gitem{opacity:0;transform:scale(1.06);filter:blur(10px) brightness(.35);transition:opacity 1.4s ease,transform 1.8s ease,filter 1.4s ease}\n.gitem.shown{opacity:1;transform:none;filter:none}\n.editing .gitem{opacity:1;transform:none;filter:none}\n/* two vaults */\n.vaults{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(30px,5vw,60px);margin-top:50px;align-items:start}\n.vcol{display:grid;justify-items:center;text-align:center}\n.vcol h3{font-size:clamp(28px,3.4vw,38px);margin:4px 0 6px}\n.vcol>p{color:var(--muted);margin:0;font-size:15px;letter-spacing:.04em}\n.vaults .vault{margin-top:26px;width:100%}\n.vaults .vdoor-wrap{width:min(190px,46vw)}\n.vaults .vault .pwrow{width:100%;max-width:360px}\n.vopen{width:100%;margin-top:26px;opacity:0;transform:translateY(24px);transition:opacity 1.1s,transform 1.1s}\n.vopen.on{opacity:1;transform:none}\n@media (max-width:860px){.vaults{grid-template-columns:1fr}}\n/* ribbon gifts */\n.gift{position:relative;display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--line);overflow:hidden;padding:0;transition:transform .4s,box-shadow .4s}\n.gift:hover,.gift:focus-visible{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.5)}\n.gift-letter{background:linear-gradient(160deg,#F6F0E2,#E9DFC8)}\n.gift-letter::before{content:\"\";position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(160deg,#EFE6D2,#E2D6BB);clip-path:polygon(0 0,100% 0,50% 100%);box-shadow:0 4px 8px rgba(0,0,0,.08)}\n.gift-fam{background:linear-gradient(160deg,#1d1d22,#060607)}\n.gift-fam::before{content:\"\";position:absolute;inset:10px;border:1px solid rgba(201,162,74,.25)}\n.rib-v,.rib-h{position:absolute;background:linear-gradient(90deg,#8A6A24,#E6CB86 50%,#8A6A24);box-shadow:0 0 8px rgba(0,0,0,.25)}\n.rib-v{top:0;bottom:0;left:50%;width:20px;margin-left:-10px}\n.rib-h{left:0;right:0;top:50%;height:20px;margin-top:-10px;background:linear-gradient(180deg,#8A6A24,#E6CB86 50%,#8A6A24)}\n.gift .bow{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-62%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}\n.gtap{position:absolute;left:0;right:0;bottom:14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase}\n.gift-letter .gtap{color:#6b5320}.gift-fam .gtap{color:var(--gold-2)}\n/* side-by-side viewers */\n.sidebyside{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);width:min(1200px,100%);height:min(88vh,860px);background:#FBF8F1;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:slideup .9s cubic-bezier(.2,.8,.2,1);overflow:hidden}\n.sbs-photo{background:#0b0b0d;display:grid;place-items:center;overflow:hidden}\n.sbs-photo img{width:100%;height:100%;object-fit:contain}\n.sbs-text{overflow-y:auto;padding:clamp(30px,5vw,56px);color:#1d1a16;text-align:left}\n.sbs-text p{font-family:var(--serif);font-weight:500;font-size:clamp(19px,1.7vw,21px);line-height:1.75;margin:0 0 1.05em}\n.sidebyside.dark{background:#0b0b0d}\n.sbs-video{display:grid;place-items:center;background:#000}\n.sbs-video video{width:100%;height:100%;object-fit:contain;background:#000}\n.sbs-video .soonmsg{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--gold-2);text-align:center;padding:20px}\n.sidebyside .close{z-index:5;color:#fff;background:rgba(0,0,0,.45);width:40px;height:40px;border-radius:50%;top:12px;right:12px;font-size:24px}\n@media (max-width:860px){\n  .vcontent{grid-template-columns:1fr}\n  .sidebyside{grid-template-columns:1fr;height:auto;max-height:none}\n  .sbs-photo img{height:auto;max-height:none}\n  .sbs-text{overflow:visible}\n  .sbs-video{min-height:56vw}\n  .sidebyside .close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}\n}\n/* lightbox + edit bar */\n.lb{position:relative;margin:0;max-width:min(1100px,100%);text-align:center}\n.lb img{display:block;max-width:100%;max-height:82vh;margin:0 auto;border:1px solid var(--line)}\n.lb figcaption{margin-top:14px;color:var(--white)}\n.lb .close{top:-44px;right:0;color:var(--white)}\n#editFab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:75;background:#08080a;border:1px solid var(--gold);color:var(--gold-2);padding:10px 18px;font-size:13px;letter-spacing:.12em}\n#editBar{position:fixed;left:0;right:0;bottom:0;z-index:76;background:rgba(8,8,10,.96);border-top:1px solid var(--gold);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}\n.editing #editBar{display:flex}\n.editing #editFab,.editing #soundBtn{display:none}\n.editing{padding-bottom:90px}\n#editBar .note{font-size:14px;color:var(--muted)}\n#editBar .acts{display:flex;gap:10px}\n#editBar .btn{padding:10px 18px}\n.led{width:min(620px,100%);background:#0f0f12;border:1px solid var(--line);padding:30px 26px;position:relative;text-align:left}\n.led h3{font-size:30px;margin-bottom:16px}\n.led label{display:block;font-size:12px;letter-spacing:.2em;color:var(--gold-2);margin:14px 0 6px;text-transform:uppercase}\n.led input,.led textarea{widt var GO = new IntersectionObserver(es => { let n = 0; es.forEach(e => { if (e.isIntersecting) { const el = e.target; setTimeout(() => el.classList.add('shown'), reduce ? 0 : 160 * n++); GO.unobserve(el); } }); }, { threshold: .2 });

/* ---------- the vault (letter + family video, one password) ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
async function kek(ans, salt) { const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(ans)), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); }
async function unwrap(wraps, answer) {
  for (const w of wraps) { try { const k = await kek(answer, b64d(w.s)); const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(w.iv) }, k, b64d(w.w)); return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']); } catch (e) {} }
  throw new Error('no');
}
const dec = (key, o) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(o.iv) }, key, b64d(o.ct));
let VKEY = null, FKEY = null, LETTER = '', PHOTO = '';
SFX.vault = () => { tone([180], .25, .25, 'triangle'); setTimeout(() => noise(.9, .3, 200, 900, 1.2), 900); setTimeout(() => tone([392, 587.3, 784, 1174.7], 3, .08, 'sine', .4), 1300); };
$$('#vault form.pwrow').forEach(form => form.addEventListener('submit', async () => {
  const v = form.dataset.v, box = $('#vault' + v), inp = form.querySelector('input'), btn = form.querySelector('button'), err = box.querySelector('.pwerr');
  const a = inp.value; if (!norm(a)) { err.textContent = 'Type the password first.'; return; }
  btn.disabled = true; err.textContent = ''; ac();
  try {
    if (v === 'L') { VKEY = await unwrap(CONTENT.vault.wraps, a); LETTER = new TextDecoder().decode(await dec(VKEY, CONTENT.vault.letter)); PHOTO = URL.createObjectURL(new Blob([await dec(VKEY, CONTENT.vault.photo)], { type: 'image/jpeg' })); }
    else { FKEY = await unwrap(CONTENT.fvault.wraps, a); }
    SFX.vault(); box.classList.add('open'); inp.blur();
    await sleep(reduce ? 100 : 2600);
    box.classList.add('gone'); await sleep(reduce ? 0 : 700); box.hidden = true;
    const o = $('#vopen' + v); o.hidden = false; void o.offsetWidth; o.classList.add('on');
  } catch (e) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); err.textContent = 'Wrong password. Try again.'; }
  btn.disabled = false;
}));
$('#vFamBtn').addEventListener('click', async () => {
  if (!FKEY) return; ac(); SFX.slide();
  const V = CONTENT.fvault, st = $('#fmStage'); $('#fmImg').src = V.cover || '';
  $('#famModal').classList.add('show');
  if (!V.video) { st.innerHTML = `<div class="soonmsg">${esc(V.soon)}</div>`; return; }
  if (!FAMURL) {
    st.innerHTML = '<div class="soonmsg">Loading…</div>';
    try { const buf = await (await fetch(V.video)).arrayBuffer(); const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(V.vIv) }, FKEY, buf); FAMURL = URL.createObjectURL(new Blob([plain], { type: 'video/mp4' })); }
    catch (e) { st.innerHTML = '<div class="soonmsg">Couldn’t load the video. Try again.</div>'; return; }
  }
  st.innerHTML = `<video controls playsinline autoplay src="${FAMURL}"></video>`;
  const vv = st.querySelector('video'); vv.muted = muted; vv.play().catch(() => {});
});
let FAMURL = '';
$('#vLetterBtn').addEventListener('click', () => {
  if (!LETTER) return; SFX.slide();
  $('#lpImg').src = PHOTO; $('#lpBody').innerHTML = LETTER.split(/\n\s*\n|\n/).filter(x => x.trim()).map(x => `<p>${esc(x)}</p>`).join('');
  $('#letterModal').classList.add('show'); $('#letterModal').scrollTop = 0; $('#lpBody').scrollTop = 0;
});
$$('.modal').forEach(m => m.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === m) { m.classList.remove('show'); m.querySelectorAll('video').forEach(v => v.pause()); } }));
addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal').forEach(m => m.classList.remove('show')); });

new IntersectionObserver((es, ob) => es.forEach(e => { if (e.isIntersecting) { $('#closing').classList.add('go'); setTimeout(() => SFX.warm(), reduce ? 0 : 3200); ob.disconnect(); } }), { threshold: .55 }).observe($('#closing'));

/* ---------- edit mode (owner/editors only) ---------- */
const CM = '__CONT' + 'ENT_MARK__', TM = '__TP' + 'L_MARK__';
function renderHTML() {
  const i1 = TEMPLATE.indexOf(CM), i2 = TEMPLATE.indexOf(TM);
  const json = JSON.stringify(CONTENT).replace(/</g, '\\u003c');
  const lit = JSON.stringify(TEMPLATE).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return TEMPLATE.slice(0, i1) + json + TEMPLATE.slice(i1 + CM.length, i2) + lit + TEMPLATE.slice(i2 + TM.length);
}
let artifactNS = null, assetsNS = null, canEditPage = false;
async function initEdit() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user'); if (!user || !(await user.canEdit())) return;
    canEditPage = true; artifactNS = await window.claude.use('artifact'); assetsNS = await window.claude.use('assets');
    if (!document.getElementById('intro')) revealEditFab();
  } catch (e) {}
}
function revealEditFab() { if (canEditPage) $('#editFab').hidden = false; }
initEdit();
function setEditable(root, on) { root.querySelectorAll('[data-k]').forEach(el => { if (on) { el.setAttribute('contenteditable', 'plaintext-only'); if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true'); } else el.removeAttribute('contenteditable'); }); }
document.addEventListener('paste', e => { if (!editing || !e.target.closest('[data-k]')) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
document.addEventListener('keydown', e => { if (editing && e.key === 'Enter' && e.target.closest('[data-k]')) { e.preventDefault(); e.target.blur(); } });
function syncFromDom() { $$('[data-k]').forEach(el => { if (el.closest('#intro')) return; setP(CONTENT, el.dataset.k, el.textContent.trim()); }); }
function note(t) { $('#editNote').textContent = t; }
$('#editFab').addEventListener('click', () => {
  editing = true; document.body.classList.add('editing'); setEditable(document, true);
  renderCards(); renderTwenty(); renderMenu(); renderGallery();
  if (!artifactNS) note('Saving isn’t available in this view. Open the page from your Claude account to edit it.');
});
$('#editCancel').addEventListener('click', () => location.reload());
$('#editSave').addEventListener('click', async () => {
  syncFromDom(); if (!artifactNS) { note('Saving isn’t available in this view.'); return; }
  const b = $('#editSave'); b.disabled = true; note('Saving…');
  try { await artifactNS.publish(renderHTML()); note('Saved. Reloading…'); }
  catch (e) { const c = e && e.code; note(c === 'conflict' ? 'A newer version was saved elsewhere. Reloading with it.' : (c === 'not_writer' || c === 'not_granted') ? 'This view can’t save changes.' : c === 'rate_limited' ? 'Saving too often. Wait a moment and try again.' : c === 'too_large' ? 'The page is too large to save. Try a smaller photo.' : 'Couldn’t save. Try again.'); b.disabled = false; }
});
let pickCb = null, pickVideo = false;
function pickFile(cb, video) { if (!assetsNS) { note('Uploads aren’t available in this view.'); return; } pickCb = cb; pickVideo = !!video; const el = video ? $('#videoPick') : $('#filePick'); el.value = ''; el.click(); }
async function shrink(file) {
  try { const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode(); const m = 1800, s = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', .87)); } catch (e) { return file; }
}
async function handleFile(el) {
  const f = el.files[0]; if (!f || !pickCb) return; note(pickVideo ? 'Uploading video… this can take a minute.' : 'Uploading photo…');
  try { const blob = pickVideo ? f : await shrink(f); const r = await assetsNS.upload(blob); pickCb(r.url); note((pickVideo ? 'Video' : 'Photo') + ' added. Remember to save changes.'); }
  catch (e) { note(e && e.code === 'too_large' ? 'That file is too large (20 MB max). Try a smaller one.' : e && e.code === 'unsupported_type' ? 'That file type isn’t supported. Try a JPG/PNG photo or an MP4 video.' : 'Couldn’t upload that file. Try another.'); }
  pickCb = null;
}
$('#filePick').addEventListener('change', () => handleFile($('#filePick')));
document.addEventListener('click', e => {
  if (!editing) return;
  const ph = e.target.closest('[data-photo]'), mp = e.target.closest('[data-mphoto]'), md = e.target.closest('[data-mdel]'), ad = e.target.closest('[data-add]'), rm = e.target.closest('[data-rm]');
  if (ph) { e.preventDefault(); pickFile(url => { syncFromDom(); setP(CONTENT, ph.dataset.photo, url); renderImages(); }); }
  if (mp) pickFile(url => { syncFromDom(); CONTENT.moments[+mp.dataset.mphoto].img = url; renderGallery(); });
  if (md) { syncFromDom(); CONTENT.moments.splice(+md.dataset.mdel, 1); renderGallery(); }
  if (e.target.closest('#addMoment')) pickFile(url => { syncFromDom(); CONTENT.moments.push({ img: url, cap: '' }); renderGallery(); });
  if (ad) { syncFromDom(); CONTENT.world.table[ad.dataset.add].push('New dish'); renderMenu(); }
  if (rm) { syncFromDom(); const [k, i] = rm.dataset.rm.split('.'); CONTENT.world.table[k].splice(+i, 1); renderMenu(); }
});
